    @font-face {

      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SerifFont';
      src: url('https://cdn.originallyxs.cc.cd/defaultfont/defaultFont-Bold.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    * {
      font-family: 'CurrentFont', sans-serif !important;
      user-select: none;
    }
    html, body {
      height: 100%;
      margin: 0;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      overflow: auto;
    }
    .serif, blockquote,h1,h2,h3,h4,h5,h6 {
      font-family: 'SerifFont', serif !important;
    }
    #loading-mask {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
      background: #c5cae9;
    }
    @media (prefers-color-scheme: dark) {
      #loading-mask {
        background: #1a237e;
      }
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #9fa8da;
      border-top-color: #283593;
      border-radius: 50%;
      transform-origin: center center;
      animation: spin 0.8s linear infinite;
    }
    .loading-footer {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .loading-footer.show {
      opacity: 1;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loading-mask.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    a {
      transition: color 0.2s ease;
    }
    a:hover {
      color: #5C6BC0 !important;
    }
    .handler-progress-outer{
      width:100%;
      height:10px;
      border-radius:5px;
      overflow:hidden;
      display:flex;
      background:#283593;
    }
    .progress-seg{
      height:100%;
    }
    .seg-red{background:#e57373;}
    .seg-yellow{background:#ffd54f;}
    .seg-green{background:#81c784;}
    .seg-grey{background:#ffa726;}
    .seg-purple{background:#29b6f6;}
  </style>
</head>

// 获取周一时间戳
function getWeekMonday(timestamp){
  const d = new Date(timestamp);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  d.setHours(0,0,0,0);
  return d.getTime();
}

// 接口加载数据
async function loadBugData() {
  try {
    const workerUrl = "https://bugapi.originallyxs.cc.cd";
    const resp = await fetch(workerUrl);
    const result = await resp.json();

    if (!result.ok) {
      throw new Error(result.msg || "接口请求失败");
    }

    bugList = result.data || [];
    const total = result.total || bugList.length;

    let pending = 0, repairing = 0, fixed = 0, cannotReproduce = 0, duplicate = 0;
    bugList.forEach(bug => {
      const status = bug.fields.bugStatus;
      switch (status) {
        case 0: pending++; break;
        case 1: repairing++; break;
        case 2: fixed++; break;
        case 3: cannotReproduce++; break;
        case 4: duplicate++; break;
      }
    });

    renderStatCards({ total, pending, repairing, fixed, cannotReproduce, duplicate });
    initCharts();

  } catch (err) {
    renderStatCards({ total: 3, pending: 1, repairing: 1, fixed: 1, cannotReproduce: 0, duplicate: 0 });
    initCharts();
  } finally {
    // ✅接口渲染全部完成之后再关闭loading，不再走window.load
    const mask = document.getElementById('loading-mask');
    if(mask){
      mask.classList.add('fade-out');
      setTimeout(()=> mask.remove(),800);
    }
  }
}

// 初始化图表
// 折线图：从【当前日期】向前取最多10周，按自然周（周一为一周起点）聚合数据
function initCharts() {
  const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
  lineChartIns = echarts.init(document.getElementById('lineChart'));
  pieChartIns = echarts.init(document.getElementById('pieChart'));

  const textColor = isDarkMode ? '#ffffff' : '#1f2937';
  const axisLineColor = isDarkMode ? '#ffffff1f' : '#0000001f';
  const fontFamilyStr = 'CurrentFont, sans-serif';

  // --------饼图数据 分类统计--------
  const typeMap = {
    0: "其他",
    1: "UI界面",
    2: "安全问题",
    3: "性能问题",
    4: "网络问题"
  };
  const typeColorMap = {
    0: "#ffd54f",
    1: "#e57373",
    2: "#ba6ac8",
    3: "#81c784",
    4: "#4fc3f7"
  };
  const typeCount = {};
  bugList.forEach(bug => {
    const type = bug.fields.bugType;
    typeCount[type] = (typeCount[type] || 0) + 1;
  });
  const pieData = Object.entries(typeCount).map(([type, count]) => ({
    name: typeMap[type] || "未知",
    value: count,
    itemStyle: { color: typeColorMap[type] || "#9e9e9e" }
  }));

  // --------折线：最近10周，周一作为周标识，从本周向前倒推--------
  const now = Date.now();
  const thisMonday = getWeekMonday(now);
  const weekList = [];
  // 生成最近10周时间轴
  for(let i = 9; i >= 0; i--){
    const t = thisMonday - (i * 7 * 24 * 3600 * 1000);
    weekList.push(t);
  }
  // 初始化每周计数
  const weekData = weekList.map(()=>({new:0,fixed:0}));

  bugList.forEach(bug=>{
    const submitTs = bug.fields.submitTime * 1000;
    const bugMondayTs = getWeekMonday(submitTs);
    const idx = weekList.indexOf(bugMondayTs);
    if(idx !== -1){
      weekData[idx].new +=1;
      if(bug.fields.bugStatus ===2){
        weekData[idx].fixed +=1;
      }
    }
  });

  const xData = weekList.map(ts=>{
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()}`;
  });
  const newBugData = weekData.map(d=>d.new);
  const fixedBugData = weekData.map(d=>d.fixed);

  lineChartIns.setOption({
    backgroundColor: 'transparent',
    textStyle: {
      fontFamily: fontFamilyStr,
      color: textColor
    },
    tooltip: {
      trigger: 'axis',
      textStyle: {
        color: textColor,
        fontFamily: fontFamilyStr
      },
      backgroundColor: isDarkMode ? '#0000008a' : '#ffffff8a',
      borderColor: isDarkMode ? '#ffffffaa' : '#000000aa',
    },
    legend: {
      data: ['新增Bug', '已修复'],
      top: 10,
      textStyle: {
        color: textColor,
        fontFamily: fontFamilyStr
      }
    },
    grid: {
      left: '3%',
      right: '4%',
      bottom: '12%',
      containLabel: true
    },
    xAxis: {
      type: 'category',
      data: xData,
      axisLine: { lineStyle: { color: axisLineColor } },
      axisTick: { lineStyle: { color: axisLineColor } },
      splitLine: { lineStyle: { color: axisLineColor } },
      axisLabel: {
        color: textColor,
        fontFamily: fontFamilyStr
      }
    },
    yAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: axisLineColor } },
      axisTick: { lineStyle: { color: axisLineColor } },
      splitLine: { lineStyle: { color: axisLineColor } },
      axisLabel: {
        color: textColor,
        fontFamily: fontFamilyStr
      }
    },
    series: [
      {
        name: '新增Bug',
        type: 'line',
        smooth: true,
        symbol: 'circle',
        areaStyle: { opacity: 0.2 },
        color: '#9575cd',
        data: newBugData
      },
      {
        name: '已修复',
        type: 'line',
        smooth: true,
        symbol: 'circle',
        areaStyle: { opacity: 0.2 },
        color: '#81c784',
        data: fixedBugData
      }
    ]
  });

  pieChartIns.setOption({
    backgroundColor: 'transparent',
    textStyle: {
      fontFamily: fontFamilyStr,
      color:textColor
    },
    tooltip: {
      trigger: 'item',
      textStyle: {
        color: textColor,
        fontFamily: fontFamilyStr
      },
      backgroundColor: isDarkMode ? '#0000008a' : '#ffffff8a',
      borderColor: isDarkMode ? '#ffffffaa' : '#000000aa',
    },
    legend: {
      orient: 'vertical',
      right: 10,
      top: 'center',
      textStyle: {
        color: textColor,
        fontFamily: fontFamilyStr
      }
    },
    series: [
      {
        type: 'pie',
        radius: ['40%', '70%'],
        center: ['45%', '55%'],
        itemStyle: {
          borderColor: 'transparent'
        },
        label: {
          textStyle: {
            fontFamily: fontFamilyStr,
            color:textColor
          }
        },
        data: pieData
      }
    ]
  });

  window.addEventListener('resize', function () {
    lineChartIns?.resize();
    pieChartIns?.resize();
  });

  // 跟随系统明暗切换重绘图表
  const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
  mediaQuery.removeEventListener('change', initCharts);
  mediaQuery.addEventListener('change', () => {
    initCharts();
  });
}
